[package]
name = "vibeping-push-poc"
version = "0.1.0"
edition = "2024"
publish = false
description = "Zero-cost iPhone standards-based Web Push proof of concept"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
base64ct = { version = "1.8", features = ["alloc", "std"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
hyper = { version = "1.7", features = ["full"] }
hyper-tls = "0.6"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
web-push-native = "0.5"

[dev-dependencies]
tempfile = "3.20"
